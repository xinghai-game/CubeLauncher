name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: 同时构建安装包
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 测试与构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查与构建
        run: |
          pnpm run check
          pnpm run build

      - name: Rust 格式与 lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      # The core suite covers offline UUID parity with Java, rule evaluation,
      # inheritance merging, installer parsing, downloader and path safety.
      - name: 核心单元测试
        run: cargo test -p launcher-core

      - name: 构建桌面应用
        run: cargo build --release -p cube-launcher

      - name: 打包安装包
        if: github.event_name == 'workflow_dispatch' && inputs.bundle
        run: pnpm tauri build
