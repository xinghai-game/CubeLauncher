[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6.0"
flate2 = "1.0"
futures-util = "0.3"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.44", features = ["fs", "io-util", "process", "sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
urlencoding = "2.1"
zip = "4.3"

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }
