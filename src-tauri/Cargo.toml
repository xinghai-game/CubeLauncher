[package]
name = "cube-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cube_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
launcher-core = { path = "../crates/launcher-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.4"
tauri-plugin-process = "2.3"
tokio = { version = "1.44", features = ["sync", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
